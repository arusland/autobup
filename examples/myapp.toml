# autobup config for one application.
# Usage: autobup -c ~/.config/autobup/myapp.toml [command]
# Keep this file chmod 600 if it contains secrets.
# Path settings may use ~ and $HOME (see README, "Paths").

# Used for the log file name, lock file name and "project:<name>" snapshot tag.
project_name = "myapp"

[repository]
url = "~/backup/restic"
# url = "sftp:backup@backup.example.com:/srv/restic/myapp"
# url = "s3:https://s3.eu-central-1.amazonaws.com/my-bucket/myapp"
# url_file = "~/.config/autobup/myapp.repo"   # alternative to url
password_file = "~/.config/autobup/myapp.pass" # create with `autobup -c ... pwd`
# password = "..."                             # alternatives to password_file
# password_command = "pass show restic/myapp"

[backup]
paths = [
    "/srv/myapp/uploads",
    "/srv/myapp/config",
    "/var/backups/myapp-db",                   # filled by the pre_backup hook
]
excludes = ["*.tmp", "/srv/myapp/uploads/cache"]
# exclude_file = "~/.config/autobup/myapp.exclude"
exclude_caches = true                          # skip dirs containing CACHEDIR.TAG
one_file_system = false
tags = []                                      # extra tags, e.g. ["daily"]
# host = "myhost"                              # override hostname stored in snapshots
extra_args = []                                # e.g. ["--compression", "max"]

# Leave a keep_* setting out to not use it. Without any, forget is skipped.
[retention]
# keep_last = 10
# keep_hourly = 24
keep_daily = 7
keep_weekly = 4
keep_monthly = 6
# keep_yearly = 2
# keep_within = "2d"
prune = true

[check]
enabled = false
# read_data_subset = "5%"                      # also read part of the data

[runtime]
log_dir = "~/.local/state/autobup"
lock_dir = "~/.cache/autobup"
nice_level = 10
ionice_class = 2                               # 2 = best-effort, 3 = idle
# healthcheck_url = "https://hc-ping.com/<uuid>"   # pinged on start/success/fail

# Both bot_token and chat_id empty/missing = disabled.
# Create a bot with @BotFather to get the token. Chat id: send the bot a
# message, then open https://api.telegram.org/bot<TOKEN>/getUpdates.
[telegram]
# bot_token = "123456789:AAE..."
# chat_id = "123456789"                        # or "-1001234567890" for a group
notify_success = true                          # false = only failures and warnings

# Shell snippets, run with `bash -eo pipefail -c`: any failing command fails the hook.
# They get the restic environment plus AUTOBUP_PROJECT and AUTOBUP_HOOK.
#   pre_backup  - failure aborts the run (no backup is made).
#   post_backup - always runs once pre_backup started; $1 = exit status so far.
#   on_failure  - runs when the run fails; $1 = exit code.
[hooks]
pre_backup = """
mkdir -p /var/backups/myapp-db
# pg_dump -U myapp myapp | gzip > /var/backups/myapp-db/myapp.sql.gz
"""
# post_backup = "rm -f /var/backups/myapp-db/*.sql.gz"
# on_failure = 'echo "backup of myapp failed with code $1" | mail -s "backup failed" admin@example.com'

# Extra environment for restic and the hooks.
[env]
# AWS_ACCESS_KEY_ID = "..."
# AWS_SECRET_ACCESS_KEY = "..."
# RESTIC_CACHE_DIR = "/var/cache/restic"
